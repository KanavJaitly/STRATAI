# Keeps the hosted API awake: Render's free plan puts a web service to sleep after 15 idle minutes, and the next
# visitor then waits about a minute for it to start (2026-11-18). A ping every 10 minutes to /health (which does not
# touch the database, so Neon still sleeps and wakes in about a second) keeps it warm.
#
# - One always-on free service uses about 744 of Render's 750 free instance hours a month, so this suits a single
#   free service. If the API moves to a paid Render plan (which never sleeps), disable this workflow in Actions.
# - GitHub may delay or skip scheduled runs at busy times, so an occasional slow start can still happen.
# - GitHub turns scheduled workflows off after 60 days without repository activity; re-enable it in Actions.
name: Keep the API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API's health check
        run: curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 5 https://stratai-api.onrender.com/health
