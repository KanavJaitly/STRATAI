# Phase 4 historical-data build (decision D3): rebuild the dataset in an
# ephemeral PostgreSQL service with the existing migrations and orchestrator,
# gate it (decision D8), and checkpoint it as a pg_dump artifact that execution
# attempts restore instead of re-syncing ~24k Statbotics records each time.
# Human-dispatched only. Resumable: a later run restores the last dump and
# continues. See docs/phase4_automation.md.

name: Phase 4 data build

on:
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: phase4-heavy
  cancel-in-progress: false

env:
  TRACKING_ISSUE: "27"
  STATE_BRANCH: automation/phase4-state

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 285
    permissions:
      contents: write   # state branch + lock ref
      issues: write     # tracking-issue notifications
      actions: read     # previous dump artifact, lock-owner run status
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: stratai
          POSTGRES_PASSWORD: ephemeral-not-a-secret
          POSTGRES_DB: stratai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stratai" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgresql://stratai:ephemeral-not-a-secret@localhost:5432/stratai
      GH_TOKEN: ${{ github.token }}
      OWNER: ${{ github.repository_owner }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Refuse untrusted refs and re-runs
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Dispatched from $GITHUB_REF. Phase 4 workflows run only main's reviewed code: dispatch from main."
            exit 1
          fi
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo "::error::This is re-run attempt $GITHUB_RUN_ATTEMPT. Re-runs reuse earlier results and are refused: dispatch a fresh run from main."
            exit 1
          fi

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet -r requirements.txt

      - name: Load automation state
        run: |
          git ls-remote --exit-code --heads origin "$STATE_BRANCH" > /dev/null
          git fetch --quiet --depth=1 origin "$STATE_BRANCH"
          git worktree add --quiet --detach "$RUNNER_TEMP/state" FETCH_HEAD

      - name: Preflight
        id: preflight
        env:
          HAS_TBA_API_KEY: ${{ secrets.TBA_API_KEY != '' }}
          HAS_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          PHASE4_MONTHLY_MINUTE_CAP: ${{ vars.PHASE4_MONTHLY_MINUTE_CAP }}
        run: >-
          python -m automation.ops preflight --kind build --state-dir "$RUNNER_TEMP/state"
          --require-secret TBA_API_KEY --out "$RUNNER_TEMP/preflight.json"

      - name: Acquire lock
        id: lock
        if: steps.preflight.outputs.allowed == 'true'
        run: python -m automation.ops lock acquire --kind build --run-id "${{ github.run_id }}" --base-sha "$(git rev-parse HEAD)"

      - name: Locate previous dump
        # Asks the Actions API whether the recorded checkpoint still exists: an
        # expired or deleted artifact means "start fresh", never a failed build.
        id: previous
        if: steps.lock.outputs.acquired == 'true'
        run: python -m automation.ops locate-dump --state-dir "$RUNNER_TEMP/state"

      - name: Download previous dump
        # continue-on-error: a checkpoint that cannot be fetched is simply not
        # resumed from -- the build starts fresh in this same run -- and Record
        # build forgets it, so no later build trips over it again.
        id: download
        if: steps.previous.outputs.available == 'true'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.previous.outputs.name }}
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/previous

      - name: Restore previous dump
        # A failure here (checksum mismatch, pg_restore error) stops the build: it
        # never continues on a half-restored database. Record build then marks the
        # checkpoint corrupt so the next build starts fresh.
        id: restore
        if: steps.download.outcome == 'success'
        env:
          EXPECTED_SHA256: ${{ steps.previous.outputs.sha256 }}
        run: |
          echo "${EXPECTED_SHA256}  $RUNNER_TEMP/previous/stratai.dump" | sha256sum --check --strict
          # Client tools must match the server's major version (the runner's own
          # client is older): run them from the service's image, already pulled,
          # connecting to the service over localhost:5432.
          docker run --rm -i --network host postgres:18 pg_restore --dbname "$DATABASE_URL" --no-owner --exit-on-error < "$RUNNER_TEMP/previous/stratai.dump"

      - name: Build and gate
        if: steps.lock.outputs.acquired == 'true'
        env:
          TBA_API_KEY: ${{ secrets.TBA_API_KEY }}
        run: python -m automation.data_build --deadline-minutes 240 --report "$RUNNER_TEMP/build-report.json"

      - name: Dump database
        id: dump
        if: steps.lock.outputs.acquired == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/dump"
          docker run --rm --network host postgres:18 pg_dump --dbname "$DATABASE_URL" --format=custom > "$RUNNER_TEMP/dump/stratai.dump"
          size=$(stat -c %s "$RUNNER_TEMP/dump/stratai.dump")
          # Artifact storage is metered against the free allowance: refuse, don't spend.
          if [ "$size" -gt 262144000 ]; then echo "dump is $size bytes, over the 250 MB ceiling" >&2; exit 1; fi
          sha=$(sha256sum "$RUNNER_TEMP/dump/stratai.dump" | cut -d' ' -f1)
          printf '{"artifact_name": "phase4-db-%s", "run_id": "%s", "sha256": "%s", "size_bytes": %s}\n' \
            "${{ github.run_id }}" "${{ github.run_id }}" "$sha" "$size" > "$RUNNER_TEMP/dump-meta.json"

      - name: Upload dump
        id: upload
        if: steps.dump.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase4-db-${{ github.run_id }}
          path: ${{ runner.temp }}/dump/stratai.dump
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: Record build
        id: record
        if: always() && steps.lock.outputs.acquired == 'true'
        env:
          UPLOADED: ${{ steps.upload.outcome }}
          PREV_RUN_ID: ${{ steps.previous.outputs.run_id }}
          PREV_AVAILABLE: ${{ steps.previous.outputs.available }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
        run: |
          # A checkpoint exists only once its artifact is uploaded; a local dump alone is not one.
          meta=()
          if [ "$UPLOADED" = "success" ] && [ -f "$RUNNER_TEMP/dump-meta.json" ]; then meta=(--dump-meta "$RUNNER_TEMP/dump-meta.json"); fi
          python -m automation.ops record-build --state-dir "$RUNNER_TEMP/state" --run-id "${{ github.run_id }}" \
            --report "$RUNNER_TEMP/build-report.json" "${meta[@]}" \
            --prev-run-id "$PREV_RUN_ID" --prev-available "$PREV_AVAILABLE" \
            --download-outcome "$DOWNLOAD_OUTCOME" --restore-outcome "$RESTORE_OUTCOME" \
            --notify-out "$RUNNER_TEMP/notify.md" --owner "$OWNER" --run-url "$RUN_URL"

      - name: Persist state
        # Only a completed record is published; a crashed one is never pushed half-written.
        id: persist
        if: always() && steps.lock.outputs.acquired == 'true' && steps.record.outcome == 'success'
        run: |
          git -C "$RUNNER_TEMP/state" config user.name "github-actions[bot]"
          git -C "$RUNNER_TEMP/state" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m automation.state_push --state-dir "$RUNNER_TEMP/state" --branch "$STATE_BRANCH" \
            --message "data build ${{ github.run_id }}" execution_state.json execution_log.jsonl

      - name: Notify tracking issue
        # The build's result is announced only once it was recorded AND is on the
        # state branch; any other combination is one "state NOT published" alarm.
        if: always() && steps.lock.outputs.acquired == 'true'
        env:
          RECORDED: ${{ steps.record.outcome }}
          PERSISTED: ${{ steps.persist.outcome }}
        run: |
          if [ "$RECORDED" = "success" ] && [ "$PERSISTED" = "success" ]; then
            if [ -f "$RUNNER_TEMP/notify.md" ]; then gh issue comment "$TRACKING_ISSUE" --body-file "$RUNNER_TEMP/notify.md"; fi
          else
            if [ "$RECORDED" != "success" ]; then why="record-build $RECORDED"; else why="state push $PERSISTED"; fi
            # shellcheck disable=SC2016  # the backticks are Markdown, not command substitution
            printf '### Phase 4 data build: state NOT published\n\n@%s\n\nThe build record could not be written to `%s` (%s), so its dump is not usable and nothing may treat this build as a result. Dispatch a new build.\n\n- Run: %s\n' \
              "$OWNER" "$STATE_BRANCH" "$why" "$RUN_URL" > "$RUNNER_TEMP/unpublished.md"
            gh issue comment "$TRACKING_ISSUE" --body-file "$RUNNER_TEMP/unpublished.md"
            exit 1
          fi

      - name: Release lock
        if: always() && steps.lock.outputs.acquired == 'true'
        run: python -m automation.ops lock release --kind build --run-id "${{ github.run_id }}"
